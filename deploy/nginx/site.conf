# /etc/nginx/sites-available/app  →  symlink into sites-enabled, then: nginx -t && systemctl reload nginx
#
# TLS is obtained and renewed by certbot:
#   certbot --nginx -d app.example.com
# It rewrites this file to add the certificate lines and the HTTP→HTTPS redirect, so run it
# once the server_name below is real and DNS already points here.

server {
    listen 80;
    server_name app.example.com;

    client_max_body_size 12M;   # must exceed the app's own multipart limit

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Needed by anything long-lived: websockets, SSE, a streamed response. Without the
        # upgrade headers a websocket app loads and then silently never connects.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # A request that thinks for a while — an export, an upstream API call — dies at the
        # default 60s with a 504 that looks like an application error.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
