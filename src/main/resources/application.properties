# Everything that differs between machines comes from the environment; the defaults here
# are for a laptop with a throwaway database, never for a server.

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/app}
spring.datasource.username=${DB_USERNAME:app}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway owns the schema. Hibernate only checks that the entities match what it finds,
# so a drifted entity fails at startup instead of silently writing to a column nobody
# migrated.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Migrations connect as the role that owns the schema; the app's own role can move rows
# but not ALTER a table. Falls back to the app user so a local database with a single
# owner keeps working unchanged.
spring.flyway.url=${DB_URL:jdbc:postgresql://localhost:5432/app}
spring.flyway.user=${FLYWAY_USER:${DB_USERNAME:app}}
spring.flyway.password=${FLYWAY_PASSWORD:${DB_PASSWORD:changeme}}

# Off deliberately. With open-session-in-view on, a lazy association read in a controller
# silently works in development and holds a database connection for the whole request;
# off, it throws, and the fix (a @Transactional read or an @EntityGraph) is the one you
# actually wanted. Turning this on to make an error go away is always the wrong fix.
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.jackson.default-property-inclusion=non_null

spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=10MB

server.port=${SERVER_PORT:8081}

# One shared token on the X-Auth-Token header. It is a door lock, not sign-in: there is
# no per-user identity behind it, which is the first thing to replace if the app ever
# serves more than one tenant.
app.auth.token=${APP_AUTH_TOKEN:changeme}
